profile.LIGHT = CAST_SHADOWS shadowMapResolution=384 shadowDistance=24.0 WATER_SKY WATER_RIPPLES !WATER_DEPTH CLOUD_STYLE=1 COPPER_EDGE FOLIAGE_WIND DETAILED_SKY ROUND_DISKS END_MATERIALS HAND_TORCH PORTAL_DEPTH
profile.BALANCED = CAST_SHADOWS shadowMapResolution=512 shadowDistance=32.0 WATER_SKY WATER_RIPPLES WATER_DEPTH CLOUD_STYLE=2 COPPER_EDGE FOLIAGE_WIND DETAILED_SKY ROUND_DISKS END_MATERIALS HAND_TORCH PORTAL_DEPTH

screen = <profile> CLOUD_STYLE [SHADOWS] [WATER] COPPER_EDGE FOLIAGE_WIND DETAILED_SKY ROUND_DISKS END_MATERIALS HAND_TORCH PORTAL_DEPTH
screen.SHADOWS = CAST_SHADOWS shadowMapResolution shadowDistance
screen.WATER = WATER_SKY WATER_RIPPLES WATER_DEPTH

#ifdef ROUND_DISKS
customTexture.celestialAtlas = textures/celestial.png
#endif

#ifdef PORTAL_DEPTH
customTexture.portalField = textures/portal-field.png
# Wrap on a tile boundary before converting large block coordinates to floats.
uniform.vec4.portalFrame = vec4(fmod(cameraPositionInt.x, 256) + cameraPositionFract.x, fmod(cameraPositionInt.y, 256) + cameraPositionFract.y, fmod(cameraPositionInt.z, 256) + cameraPositionFract.z, frameTimeCounter / 3600.0)
#endif

#ifdef DETAILED_SKY
customTexture.nightAtlas = textures/night-sky.png
customTexture.endGlowField = textures/end-field.png
# Wrap before converting to float. Wind completes an integer tile per timer hour.
uniform.vec3.endGlowOrigin = vec3((fmod(cameraPositionInt.x,1024) + cameraPositionFract.x) / 1024.0 + frameTimeCounter / 3600.0, cameraPosition.y - 76.0, (fmod(cameraPositionInt.z,1024) + cameraPositionFract.z) / 1024.0 - frameTimeCounter / 3600.0)
#endif

#if CLOUD_STYLE > 0
texture.noise = textures/cloudfield.png
clouds = off
# Reduce unshifted integers before adding fractions to retain precision at the world border.
variable.int.cloudBlockX = fmod(cameraPositionInt.x, 768)
variable.int.cloudBlockZ = fmod(cameraPositionInt.z, 768)
# Integral tile shifts at the hourly timer wrap keep both fields continuous.
variable.float.cloudHour = frameTimeCounter / 3600.0
variable.float.cloudDays = (fmod(worldDay, 16) + worldTime / 24000.0) / 16.0
uniform.vec2.cloudOriginXZ = vec2(cloudBlockX + cameraPositionFract.x + 9216.0 * cloudHour, cloudBlockZ + cameraPositionFract.z - 3072.0 * cloudHour)
uniform.vec2.cloudDetailShift = vec2(8.0 * cloudHour + 3.0 * cloudDays, 7.0 * cloudHour - 5.0 * cloudDays)
uniform.vec2.cloudDryShift = vec2(17.0 * cloudHour + cloudDays, -11.0 * cloudHour + 2.0 * cloudDays)
# Minecraft ramps rain and thunder separately. X fills gaps, Y tints the banks.
uniform.vec2.cloudStorm = vec2(0.24 * rainStrength + 0.48 * thunderStrength, 0.74 * rainStrength + 0.25 * thunderStrength)
# Raise the density threshold after dusk. Rain restores the thicker sky.
uniform.float.cloudClearNight = clamp((worldTime - 11900.0) / 2000.0, 0.0, 1.0) * clamp((24000.0 - worldTime) / 1600.0, 0.0, 1.0) * (1.0 - rainStrength)
#endif

#if defined(FOLIAGE_WIND) || defined(WATER_RIPPLES)
# Reduce the unshifted integers before converting them to floats, including at negative X/Z.
variable.int.motionBlockX = fmod(cameraPositionInt.x, 256)
variable.int.motionBlockZ = fmod(cameraPositionInt.z, 256)
uniform.vec2.motionOriginXZ = vec2(motionBlockX + cameraPositionFract.x, motionBlockZ + cameraPositionFract.z)
#endif

# Keep Minecraft's vertex AO and face shading. Both work without a shadow pass.
oldLighting = true
separateAo = false
shadowTranslucent = false
shadowEntities = false
shadowPlayer = false
shadowBlockEntities = false

# When enabled, let Iris infer the pass from live samplers in each dimension.
#ifndef CAST_SHADOWS
shadow.enabled = false
#endif
program.overworld/shadow.enabled = CAST_SHADOWS
