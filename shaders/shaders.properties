profile.LIGHT = !CAST_SHADOWS shadowMapResolution=512 shadowDistance=32.0 !WATER_SKY !WATER_RIPPLES COPPER_EDGE
profile.BALANCED = CAST_SHADOWS shadowMapResolution=512 shadowDistance=32.0 WATER_SKY WATER_RIPPLES COPPER_EDGE

screen = <profile> COPPER_EDGE [SHADOWS] [WATER]
screen.SHADOWS = CAST_SHADOWS shadowMapResolution shadowDistance
screen.WATER = WATER_SKY WATER_RIPPLES

# Keep Minecraft's vertex AO and face shading. Both work without a shadow pass.
oldLighting = true
separateAo = false
shadowTranslucent = false
shadowEntities = false
shadowPlayer = false
shadowBlockEntities = false

# When enabled, let Iris infer the pass from live samplers in each dimension.
#ifndef CAST_SHADOWS
shadow.enabled = false
#endif
program.overworld/shadow.enabled = CAST_SHADOWS
