profile.LIGHT = CAST_SHADOWS shadowMapResolution=384 shadowDistance=24.0 WATER_SKY WATER_RIPPLES !WATER_DEPTH CLOUD_STYLE=1 COPPER_EDGE FOLIAGE_WIND
profile.BALANCED = CAST_SHADOWS shadowMapResolution=512 shadowDistance=32.0 WATER_SKY WATER_RIPPLES WATER_DEPTH CLOUD_STYLE=2 COPPER_EDGE FOLIAGE_WIND

screen = <profile> CLOUD_STYLE [SHADOWS] [WATER] COPPER_EDGE FOLIAGE_WIND
screen.SHADOWS = CAST_SHADOWS shadowMapResolution shadowDistance
screen.WATER = WATER_SKY WATER_RIPPLES WATER_DEPTH

#if CLOUD_STYLE > 0
texture.noise = textures/cloudfield.png
clouds = off
#endif

# Keep Minecraft's vertex AO and face shading. Both work without a shadow pass.
oldLighting = true
separateAo = false
shadowTranslucent = false
shadowEntities = false
shadowPlayer = false
shadowBlockEntities = false

# When enabled, let Iris infer the pass from live samplers in each dimension.
#ifndef CAST_SHADOWS
shadow.enabled = false
#endif
program.overworld/shadow.enabled = CAST_SHADOWS
